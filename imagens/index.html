<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Imagens</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>
    <!-- img vs figure -->
    <!-- img -->
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80"
        alt="Paisagem com montanhas e lago ao pôr do sol" />
    <!-- img com figure -->
    <figure>
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80"
            alt="Paisagem com montanhas e lago ao pôr do sol" />
        <figcaption>Figura 1: Paisagem com montanhas e lago ao pôr do sol</figcaption>
    </figure>

</body>

</html>
