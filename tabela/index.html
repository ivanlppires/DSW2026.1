<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Tabelas</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Endereço</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>João</td>
                <td>25</td>
                <td>Rua A, 123</td>
            </tr>
            <tr>
                <td>José</td>
                <td>26</td>
                <td>Rua B, 231</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan='3'>Total de pessoas: 2</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
